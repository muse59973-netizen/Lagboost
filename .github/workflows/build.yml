name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o LagBoostApp.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: cd LagBoostApp && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LagBoost-debug-apk
          path: LagBoostApp/app/build/outputs/apk/debug/app-debug.apk
